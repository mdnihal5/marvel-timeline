<head>

<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f1;--panel:#ffffff;--line:#e2e2dd;--ink:#16181b;--sub:#686b70;--mute:#b8babd;--guide:#e7e7e2;--rel:#c47400;--sto:#0a87a2;--on-hero:#fff;--shadow:0 24px 60px -24px rgba(20,22,26,.28);
  --h-ironman:#df4339;--h-cap:#2f6fe6;--h-thor:#c28f00;--h-hulk:#2d9a52;--h-widow:#5b5f66;--h-spidey:#de3f88;--h-panther:#7a5ade;--h-wanda:#dd6716;--h-strange:#0f958c;--h-loki:#6c960f;
  --ease:cubic-bezier(.2,.7,.2,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1113;--panel:#16191c;--line:#262a2f;--ink:#eceae4;--sub:#9a9c9e;--mute:#4b5056;--guide:#1d2125;--rel:#ffb547;--sto:#5fd4e8;--on-hero:#111;--shadow:0 30px 80px -20px rgba(0,0,0,.7);
  --h-ironman:#ff5a4e;--h-cap:#4f8dff;--h-thor:#ffd166;--h-hulk:#57d27a;--h-widow:#e8e6e1;--h-spidey:#ff6fb1;--h-panther:#a98bff;--h-wanda:#ff8f3d;--h-strange:#3fd0c9;--h-loki:#b5e35a}}
:root[data-theme=dark]{--bg:#0f1113;--panel:#16191c;--line:#262a2f;--ink:#eceae4;--sub:#9a9c9e;--mute:#4b5056;--guide:#1d2125;--rel:#ffb547;--sto:#5fd4e8;--on-hero:#111;--shadow:0 30px 80px -20px rgba(0,0,0,.7);
  --h-ironman:#ff5a4e;--h-cap:#4f8dff;--h-thor:#ffd166;--h-hulk:#57d27a;--h-widow:#e8e6e1;--h-spidey:#ff6fb1;--h-panther:#a98bff;--h-wanda:#ff8f3d;--h-strange:#3fd0c9;--h-loki:#b5e35a}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 "Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
button,select{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--sto);outline-offset:2px;border-radius:6px}

/* header */
.views{display:flex;gap:2px;margin-left:4px;padding-left:10px;border-left:1px solid var(--line)}.views a{padding:5px 9px;border-radius:7px;font-size:13px;font-weight:500;color:var(--sub);text-decoration:none;transition:color .2s,background .2s}.views a:hover{color:var(--ink)}.views a[aria-current=page]{color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}

.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:20px;padding:14px 32px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-stretch:125%;letter-spacing:.02em;text-transform:uppercase;font-size:14px;white-space:nowrap}
.seg{position:relative;display:flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.seg button{position:relative;z-index:1;border:0;background:none;padding:7px 16px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--sub);transition:color .2s}
.seg button[aria-pressed=true]{color:var(--bg)}
.seg .pill{position:absolute;top:3px;bottom:3px;border-radius:999px;background:var(--ink);transition:left .45s var(--ease),width .45s var(--ease)}
.sp{flex:1}
.reg{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.theme{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.theme svg{transition:transform .5s var(--ease)}
:root[data-theme=dark] .theme svg{transform:rotate(180deg)}

/* lens heading + controls */
.head{max-width:1180px;margin:auto;padding:40px 32px 0;display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap}
.copy{flex:1;min-width:300px}
.copy h1{margin:0;font-size:clamp(30px,3.6vw,46px);line-height:1;font-weight:800;font-stretch:125%;letter-spacing:-.01em;text-transform:uppercase}
.copy p{margin:12px 0 0;font:italic 19px/1.4 "Newsreader";color:var(--sub);max-width:52ch}
.copy>*{transition:opacity .25s,transform .25s var(--ease)}
.copy.swap>*{opacity:0;transform:translateY(6px)}
.ctl{display:none;align-items:center;gap:8px;flex-wrap:wrap}
.ctl.on{display:flex;animation:fade .4s var(--ease)}
.ctl[data-for=heroes]{flex-basis:100%}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--sub);transition:color .2s,border-color .2s,background .2s}
.btn:hover{color:var(--ink);border-color:var(--sub)}
.btn.main{background:var(--rel);border-color:var(--rel);color:#111}
.hero-chip{display:inline-flex;align-items:center;gap:7px}
.hero-chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.hero-chip[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--on-hero)}
.hero-chip[aria-pressed=true] i{background:var(--on-hero)}
.cap{max-width:1180px;margin:auto;padding:14px 32px 0;min-height:40px;font-size:14px;color:var(--sub)}
.cap b{color:var(--ink)}.cap .j{color:var(--sto);font-weight:600}
.cap span{display:inline-block;animation:fade .35s var(--ease)}

/* stage */
.stage{max-width:1180px;margin:10px auto 0;padding:0 20px;overflow-x:auto}
#c{display:block;width:100%;min-width:760px;height:auto}
#c text{font-family:Archivo}
.t{cursor:pointer}
.t path{fill:none;stroke-width:1.5;opacity:.55;transition:opacity .25s,stroke-width .2s}
.t text{font-size:11.5px;fill:var(--sub);transition:fill .2s}
.t text.e1{font-weight:700;fill:var(--ink)}
.t circle{stroke:var(--bg);stroke-width:2.5}
#c.focus .t:not(.on) path{opacity:.08}
#c.focus .t:not(.on) text{fill:var(--mute)}
.t.on path{opacity:1;stroke-width:2.8}
.t.on text{fill:var(--ink)}
.lyr{opacity:0;pointer-events:none;transition:opacity .5s}
#c[data-lens=order] #L-order,#c[data-lens=time] #L-time,#c[data-lens=heroes].ready #L-heroes{opacity:1;pointer-events:auto}
.colh{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.guide{fill:none;stroke:var(--guide);stroke-width:20;stroke-linecap:round}
.yr{font-size:11px;font-weight:700;fill:var(--sto);letter-spacing:.04em}
.relall{fill:none;stroke:var(--rel);stroke-width:1;opacity:.12}
.rel{fill:none;stroke:var(--rel);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.halo{fill:none;stroke:var(--rel);stroke-width:2}
.tip{font-size:13.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:5px;pointer-events:none}
.ring{fill:none;stroke:var(--line)}
.ring.d{stroke-dasharray:2 7}
.lk{fill:none;stroke-width:1.3;opacity:.5;transition:opacity .2s}
#L-heroes.hov .lk{opacity:.06}#L-heroes.hov .lk.on{opacity:.9}
.co{cursor:pointer}.co text{font-size:12px;font-weight:700;fill:var(--sub)}.co .ini{font-size:12px;font-weight:800;fill:var(--on-hero)}
.co:hover circle{transform:scale(1.08)}.co circle{transform-box:fill-box;transform-origin:center;transition:transform .2s var(--ease)}
.ctr .nm{font-size:20px;font-weight:800;font-stretch:120%;text-transform:uppercase;fill:var(--ink)}
.ctr .sb{font:italic 15px Newsreader;fill:var(--sub)}
.legend{max-width:1180px;margin:auto;padding:6px 32px 0;display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:7px}.legend i{width:18px;height:3px;border-radius:2px;background:var(--c)}
.legend [hidden]{display:none}
footer{max-width:1180px;margin:auto;padding:28px 32px 40px;font-size:12px;color:var(--sub)}

/* card */
.card{position:fixed;z-index:20;top:76px;right:18px;width:min(360px,calc(100vw - 36px));max-height:calc(100vh - 94px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  transform:translateX(calc(100% + 30px));opacity:0;visibility:hidden;transition:transform .42s var(--ease),opacity .42s,visibility 0s .42s}
.card.on{transform:none;opacity:1;visibility:visible;transition:transform .42s var(--ease),opacity .42s}
.card .art{height:120px;position:relative;display:flex;align-items:flex-end;padding:14px 18px;color:#fff}
.card .art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.45),transparent 65%)}
.card .art b{position:relative;z-index:1;font-size:21px;line-height:1.05;font-weight:800;font-stretch:112%;text-transform:uppercase}
.card .x{position:absolute;z-index:2;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.35);display:grid;place-items:center}
.card .bd{padding:16px 18px 18px}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.clock{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.clock small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.clock.r small{color:var(--rel)}.clock.s small{color:var(--sto)}
.clock span{font-size:22px;font-weight:800;font-stretch:110%;font-variant-numeric:tabular-nums}
.clock em{font-style:normal;color:var(--sub);font-size:12px;margin-left:6px}
.hook{font:italic 17px/1.35 Newsreader;margin:0 0 12px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:0 0 12px}
.facts dt{color:var(--sub)}.facts dd{margin:0;font-weight:600}
.who{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.watch{width:100%;border:0;border-radius:10px;padding:12px;background:var(--ink);color:var(--bg);font-weight:800;font-stretch:110%;text-transform:uppercase;letter-spacing:.04em}
@media (max-width:760px){.top{padding:10px 14px;gap:10px;flex-wrap:wrap}.seg{order:3;width:100%}.seg button{flex:1}.head{padding:24px 16px 0}.cap,.legend,footer{padding-left:16px;padding-right:16px}.stage{padding:0 8px}
  .card{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-height:72vh;transform:translateY(calc(100% + 20px))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="../" style="text-decoration:none;color:inherit"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="10" cy="14" r="8" fill="none" stroke="var(--rel)" stroke-width="2.5"/><circle cx="18" cy="14" r="8" fill="none" stroke="var(--sto)" stroke-width="2.5"/></svg>MCU in order</a>

</header>
<section class="head">
  <div class="copy" id="copy"><h1></h1><p></p></div>

<main class="stage"><svg id="c" viewBox="0 0 1100 900" data-lens="order" role="img" aria-label="Marvel titles in release order, story order and by hero"></svg></main>

<script>
(() => {

}
const tip = el("text", { class: "tip" });

function layout(lens) {

  } else {
    const h = HEROES.find((v) => v.id === hero), ts = S.filter((x) => h.t.includes(x.id)), rest = S.filter((x) => !h.t.includes(x.id));
    ts.forEach((x, i) => { const a = -Math.PI / 2 + (i / ts.length) * Math.PI * 2, c = Math.cos(a);
      m.set(x.id, { ax: CX + R1 * c, ay: CY + R1 * Math.sin(a), bx: CX + R1 * c, by: CY + R1 * Math.sin(a), r: x.e === 1 ? 8 : 5.5, op: 1, lo: 1, lbo: 0, lx: c * 16, ly: Math.sin(a) * 16 + 4, po: 0, anchor: Math.abs(c) < 0.22 ? "middle" : c > 0 ? "start" : "end", fill: `var(--h-${h.id})`, a }); });
    rest.forEach((x, i) => { const a = -Math.PI / 2 + (i / rest.length) * Math.PI * 2; m.set(x.id, { ax: CX + R3 * Math.cos(a), ay: CY + R3 * Math.sin(a), bx: CX + R3 * Math.cos(a), by: CY + R3 * Math.sin(a), r: 2.2, op: 0.6, lo: 0, lbo: 0, lx: 0, ly: 0, po: 0, anchor: "start", fill: "var(--mute)" }); });
    // heroes who share a title sit outside, at the average angle of what they share, pushed apart so they never touch
    const co = HEROES.filter((o) => o.id !== hero).map((o) => ({ o, sh: ts.filter((x) => o.t.includes(x.id)) })).filter((v) => v.sh.length);
    co.forEach((v) => { const s = v.sh.reduce((q, x) => [q[0] + Math.cos(m.get(x.id).a), q[1] + Math.sin(m.get(x.id).a)], [0, 0]); v.a = Math.atan2(s[1], s[0]); });

const cur = new Map();

    const s = cur.get(x.id), e = E.get(x.id), len = Math.hypot(s.bx - s.ax, s.by - s.ay), mx = (s.ax + s.bx) / 2;
    e.p.setAttribute("d", len > 1 ? `M${s.ax} ${s.ay}C${mx} ${s.ay} ${mx} ${s.by} ${s.bx} ${s.by}` : "");
    e.p.setAttribute("stroke-opacity", Math.min(1, len / 250) * s.po);
    e.c.setAttribute("cx", s.ax); e.c.setAttribute("cy", s.ay); e.c.setAttribute("r", Math.max(0, s.r));
    e.g.setAttribute("opacity", s.op);
    e.ta.setAttribute("x", s.ax + s.lx); e.ta.setAttribute("y", s.ay + s.ly); e.ta.setAttribute("opacity", s.lo);
    e.tb.setAttribute("x", s.bx + 10); e.tb.setAttribute("y", s.by + 4); e.tb.setAttribute("opacity", s.lbo);
  }
}
function drawOrbit() {
  const { h, ts, co, m } = orbit; linksG.innerHTML = ""; coG.innerHTML = "";
  co.forEach((v) => { const x0 = CX + R2 * Math.cos(v.a), y0 = CY + R2 * Math.sin(v.a);
    v.sh.forEach((x) => { const t = m.get(x.id), qx = ((x0 + t.ax) / 2) * 0.6 + CX * 0.4, qy = ((y0 + t.ay) / 2) * 0.6 + CY * 0.4; el("path", { class: "lk", "data-t": x.id, d: `M${x0} ${y0}Q${qx} ${qy} ${t.ax} ${t.ay}`, style: `stroke:var(--h-${v.o.id})` }, linksG); });
    const g = el("g", { class: "co", "data-h": v.o.id, tabindex: 0, role: "button", "aria-label": "Centre on " + v.o.name }, coG);
    el("circle", { cx: x0, cy: y0, r: 20, style: `fill:var(--h-${v.o.id})` }, g);
    el("text", { class: "ini", x: x0, y: y0 + 4.5, "text-anchor": "middle" }, g).textContent = v.o.short;
    el("text", { x: x0, y: y0 + (y0 > CY ? 38 : -28), "text-anchor": "middle" }, g).textContent = `${v.o.name} · ${v.sh.length}`; });
  const c = el("g", { class: "ctr" }, coG);
  el("circle", { cx: CX, cy: CY, r: 70, style: `fill:var(--h-${h.id});opacity:.13` }, c);
  el("circle", { cx: CX, cy: CY, r: 50, style: `fill:var(--h-${h.id})` }, c);
  el("text", { x: CX, y: CY + 9, "text-anchor": "middle", style: "font-size:24px;font-weight:800;font-stretch:115%;fill:var(--on-hero)" }, c).textContent = h.short;
  el("text", { class: "nm", x: CX, y: CY + 100, "text-anchor": "middle" }, c).textContent = h.name;
  el("text", { class: "sb", x: CX, y: CY + 122, "text-anchor": "middle" }, c).textContent = `${ts.length} titles · ${hoursOf(ts)}`;
}

/* ---------- moving between views: every title glides from where it is to where it belongs ---------- */
let lens = "order", raf = 0;
// labels and curves leave in the first quarter and arrive in the last third, so nothing overlaps mid-flight
const FADE = new Set(["lo", "lbo", "po"]), fadeK = (k, out) => (out ? Math.min(1, k * 4) : Math.max(0, (k - 0.66) / 0.34));
const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
function morph(next, instant) {
  const tgt = layout(next), from = new Map([...cur].map(([k, v]) => [k, { ...v }]));
  svg.dataset.lens = next; svg.classList.remove("ready", "focus");
  for (const x of S) { const t = tgt.get(x.id), e = E.get(x.id); e.ta.setAttribute("text-anchor", t.anchor); e.c.style.fill = t.fill; e.g.classList.remove("on"); }
  tip.textContent = "";
  const done = () => { if (next === "heroes") { drawOrbit(); svg.classList.add("ready"); } };
  if (instant || RM || !from.size) { for (const x of S) cur.set(x.id, { ...tgt.get(x.id) }); paint(); done(); return; }
  cancelAnimationFrame(raf);
  const t0 = performance.now(), DUR = 900, order = next === "time" ? si : ri;
  const step = (now) => { let fin = true;
    for (const x of S) { const k = Math.min(1, Math.max(0, (now - t0 - order.get(x.id) * 6) / DUR)); if (k < 1) fin = false; const q = ease(k), f = from.get(x.id), t = tgt.get(x.id), s = cur.get(x.id); for (const n of NUM) s[n] = f[n] + (t[n] - f[n]) * (FADE.has(n) ? fadeK(k, t[n] < f[n]) : q); }
    paint(); if (!fin) raf = requestAnimationFrame(step); else done(); };
  raf = requestAnimationFrame(step);
}

/* ---------- lens chrome ---------- */
const COPY = {
  order: ["Two orders. One story.", "Left is when each title came out, right is when it happens. Hover a line to follow it; the steep ones are where the watch-order arguments live."],
  time: ["Story time, wound into a spiral.", "1943 sits at the centre, 2027 at the edge. Play the release order and the amber line shows how often the films jumped back in time."],
  heroes: ["Who meets whom.", "Pick a hero. Their titles circle them, and the heroes they share a title with sit outside. Click an outer hero to travel to them."],
};
const LEG = {
  order: `<span style="--c:var(--sto)"><i></i>Happens earlier than it came out</span><span style="--c:var(--rel)"><i></i>Happens later</span><span style="--c:var(--mute)"><i></i>About the same</span><span>Bold = essential</span>`,
  time: `<span style="--c:var(--ink)"><i></i>Big bead = essential</span><span style="--c:var(--rel)"><i></i>Release order</span><span style="--c:var(--sto)"><i></i>Year in the story</span>`,
  heroes: `<span style="--c:var(--mute)"><i></i>Outer dots: everything else, for scale</span><span>Number = titles shared</span>`,
};
const seg = document.getElementById("seg"), pill = seg.querySelector(".pill"), copy = document.getElementById("copy"), cap = document.getElementById("cap");
const putPill = () => { const b = seg.querySelector("[aria-pressed=true]"); pill.style.left = b.offsetLeft + "px"; pill.style.width = b.offsetWidth + "px"; };
function setLens(next, instant) {
  stop(); lens = next;
  seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === next)); putPill();
  document.querySelectorAll(".ctl").forEach((c) => c.classList.toggle("on", c.dataset.for === next));
  copy.classList.add("swap");
  setTimeout(() => { copy.querySelector("h1").textContent = COPY[next][0]; copy.querySelector("p").textContent = COPY[next][1]; copy.classList.remove("swap"); }, instant ? 0 : 200);
  document.getElementById("legend").innerHTML = LEG[next];
  cap.innerHTML = next === "heroes" ? heroCap() : next === "time" ? `<span>Press play, or use the arrows, to walk the release order.</span>` : "";
  rel.setAttribute("d", ""); halo.setAttribute("r", 0); k = -1;
  history.replaceState(null, "", "#" + next + (next === "heroes" ? ":" + hero : ""));
  morph(next, instant);
}
seg.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b && b.dataset.l !== lens) setLens(b.dataset.l); });
addEventListener("resize", putPill); document.fonts && document.fonts.ready.then(putPill);

/* order: replay draws the curves in again */
function drawIn() { if (RM) return; S.forEach((x) => { const p = E.get(x.id).p, L = p.getTotalLength(); if (!L) return; p.animate([{ strokeDasharray: L, strokeDashoffset: L }, { strokeDasharray: L, strokeDashoffset: 0 }], { duration: 750, delay: 120 + ri.get(x.id) * 20, easing: "cubic-bezier(.2,.7,.2,1)", fill: "backwards" }); }); }
document.getElementById("redraw").onclick = drawIn;

/* time: walk the release order */
let k = -1, timer = null; const playB = document.getElementById("play");
function show(i) {
  k = Math.max(0, Math.min(R.length - 1, i)); const x = R[k], prev = R[k - 1], j = prev ? x.y - prev.y : 0, [px, py, a] = SP[si.get(x.id)];
  rel.setAttribute("d", relPath(k)); halo.setAttribute("cx", px); halo.setAttribute("cy", py); halo.setAttribute("r", 14);
  tip.setAttribute("x", px + (Math.cos(a) >= 0 ? 18 : -18)); tip.setAttribute("y", py - 12); tip.setAttribute("text-anchor", Math.cos(a) >= 0 ? "start" : "end"); tip.textContent = short(x.t);
  cap.innerHTML = `<span><b>#${k + 1} · ${x.t}</b> · out ${x.d.slice(0, 4)}, happens in ${x.y} · ${!prev ? "where it all started" : j < -2 ? `<span class="j">jumps back ${-j} years</span>` : j > 2 ? `moves ${j} years forward` : "picks up where the last one left off"}</span>`;
}
function stop() { if (timer) { clearInterval(timer); timer = null; playB.textContent = "Play release order"; } }
playB.onclick = () => { if (timer) return stop(); if (k >= R.length - 1) k = -1; playB.textContent = "Pause"; show(k + 1); timer = setInterval(() => { show(k + 1); if (k >= R.length - 1) stop(); }, 950); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };

/* heroes */
const heroesEl = document.getElementById("heroes");
heroesEl.innerHTML = HEROES.map((h) => `<button class="btn hero-chip" style="--c:var(--h-${h.id})" data-h="${h.id}" aria-pressed="${h.id === hero}"><i></i>${h.name}</button>`).join("");
function heroCap() { const h = HEROES.find((v) => v.id === hero), ts = S.filter((x) => h.t.includes(x.id)); return `<span><b>${h.name}'s path:</b> ${ts.map((x) => short(x.t)).join(" → ")}</span>`; }
function pickHero(id) { if (id === hero && lens === "heroes") return; hero = id; heroesEl.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.h === id)); if (lens !== "heroes") return setLens("heroes"); cap.innerHTML = heroCap(); history.replaceState(null, "", "#heroes:" + id); morph("heroes"); }
heroesEl.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) pickHero(b.dataset.h); });

/* pointer: hover follows a title, click opens it */
let pinned = null;
function focus(id) {
  if (lens === "order") { svg.classList.toggle("focus", !!id); E.forEach((e, k2) => e.g.classList.toggle("on", k2 === id)); }
  else if (lens === "heroes") { Lheroes.classList.toggle("hov", !!id); linksG.querySelectorAll(".lk").forEach((l) => l.classList.toggle("on", l.dataset.t === id)); }
  else if (lens === "time") { const sid = id || (k >= 0 ? R[k].id : null); if (!sid) { tip.textContent = ""; return; } const [px, py, a] = SP[si.get(sid)]; tip.setAttribute("x", px + (Math.cos(a) >= 0 ? 18 : -18)); tip.setAttribute("y", py - 12); tip.setAttribute("text-anchor", Math.cos(a) >= 0 ? "start" : "end"); tip.textContent = short(byId.get(sid).t); }
}
svg.addEventListener("pointerover", (e) => { const g = e.target.closest(".t"); focus(g ? g.dataset.id : pinned); });
svg.addEventListener("pointerleave", () => focus(pinned));
const act = (e) => { const co = e.target.closest(".co"); if (co) return pickHero(co.dataset.h); const g = e.target.closest(".t"); if (g && +g.getAttribute("opacity") > 0.7) { pinned = g.dataset.id; open(pinned); focus(pinned); } };
svg.addEventListener("click", act);
svg.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(e); } });

/* card */
const card = document.getElementById("card");
function open(id) {
  const x = byId.get(id), d = shift(x), hs = HEROES.filter((h) => h.t.includes(id));
  card.innerHTML = `<div class="art" style="background:linear-gradient(150deg,${x.c[0]},${x.c[0]} 40%,${x.c[1]})"><b>${x.t}</b><button class="x" aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="#fff" stroke-width="2"/></svg></button></div>
  <div class="bd"><div class="clocks"><div class="clock r"><small>Released</small><span>#${ri.get(id) + 1}</span><em>${x.d.slice(0, 4)}</em></div><div class="clock s"><small>Happens</small><span>#${si.get(id) + 1}</span><em>${x.y}</em></div></div>
  <p class="hook">${x.hook}</p>
  <dl class="facts"><dt>Type</dt><dd>${MW.kindLabel[x.k]}${x.ep ? ` · ${x.ep} episodes` : ""}</dd><dt>Runtime</dt><dd>${MW.hours(x.m)}</dd><dt>Priority</dt><dd>${MW.essLabel[x.e]}</dd><dt>After credits</dt><dd>${x.pc ? `${x.pc} scene${x.pc > 1 ? "s" : ""}, stay` : "Nothing, you can leave"}</dd>${Math.abs(d) > 1 ? `<dt>Order</dt><dd>${Math.abs(d)} places ${d > 0 ? "earlier" : "later"} in story order</dd>` : ""}</dl>
  ${hs.length ? `<div class="who">${hs.map((h) => `<button class="btn hero-chip" style="--c:var(--h-${h.id})" data-h="${h.id}"><i></i>${h.name}</button>`).join("")}</div>` : ""}
  <button class="watch">${x.soon ? "In cinemas Dec 18" : "Watch on " + MW.where(x, region())}</button></div>`;
  card.classList.add("on");
}
function close() { card.classList.remove("on"); pinned = null; focus(null); }
card.addEventListener("click", (e) => { if (e.target.closest(".x")) return close(); const h = e.target.closest(".hero-chip"); if (h) { close(); pickHero(h.dataset.h); } });
addEventListener("keydown", (e) => { if (e.key === "Escape" && card.classList.contains("on")) close(); });
document.getElementById("reg").addEventListener("change", () => { if (pinned) open(pinned); });

/* start */
const [h0, h1] = location.hash.slice(1).split(":");
if (h1 && HEROES.some((h) => h.id === h1)) { hero = h1; heroesEl.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.h === hero)); }
setLens(["order", "time", "heroes"].includes(h0) ? h0 : "order", true);
if (lens === "order") drawIn();
})();
</script>
</body>
</html>
