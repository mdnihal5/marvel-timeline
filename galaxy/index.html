<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230c0e13%22/%3E%3Cpath d=%22M8 22l8-12 8 6M16 10l2 14%22 stroke=%22%235d6575%22 stroke-width=%221.6%22 fill=%22none%22/%3E%3Ccircle cx=%228%22 cy=%2222%22 r=%223%22 fill=%22%23c6cddb%22/%3E%3Ccircle cx=%2216%22 cy=%2210%22 r=%223.6%22 fill=%22%238aa9ff%22/%3E%3Ccircle cx=%2224%22 cy=%2216%22 r=%222.6%22 fill=%22%23c6cddb%22/%3E%3C/svg%3E">
<title>MCU galaxy</title>
<meta name="description" content="Every Marvel Studios film and series as a graph: titles linked by the heroes they share. Explore freely or travel through the order.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--panel:#ffffff;--ink:#14171c;--sub:#6b7280;--faint:#9aa1ad;--line:#e4e7ec;--node:#3a4150;--link:#d3d8e0;--accent:#3d63dd;--accent-soft:rgba(61,99,221,.12);--rel:#c47400;--sto:#0a87a2;--star:20,30,60;--shadow:0 12px 40px -16px rgba(20,24,32,.22);
  --h-ironman:#df4339;--h-cap:#2f6fe6;--h-thor:#c28f00;--h-hulk:#2d9a52;--h-widow:#5b5f66;--h-spidey:#de3f88;--h-panther:#7a5ade;--h-wanda:#dd6716;--h-strange:#0f958c;--h-loki:#6c960f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c0e13;--panel:#151820;--ink:#e8ebf1;--sub:#9098a8;--faint:#5d6575;--line:#232834;--node:#c6cddb;--link:#283041;--accent:#8aa9ff;--accent-soft:rgba(138,169,255,.14);--rel:#ffb547;--sto:#5fd4e8;--star:200,215,255;--shadow:0 16px 48px -16px rgba(0,0,0,.6);
  --h-ironman:#ff5a4e;--h-cap:#4f8dff;--h-thor:#ffd166;--h-hulk:#57d27a;--h-widow:#e8e6e1;--h-spidey:#ff6fb1;--h-panther:#a98bff;--h-wanda:#ff8f3d;--h-strange:#3fd0c9;--h-loki:#b5e35a}}
:root[data-theme=dark]{--bg:#0c0e13;--panel:#151820;--ink:#e8ebf1;--sub:#9098a8;--faint:#5d6575;--line:#232834;--node:#c6cddb;--link:#283041;--accent:#8aa9ff;--accent-soft:rgba(138,169,255,.14);--rel:#ffb547;--sto:#5fd4e8;--star:200,215,255;--shadow:0 16px 48px -16px rgba(0,0,0,.6);
  --h-ironman:#ff5a4e;--h-cap:#4f8dff;--h-thor:#ffd166;--h-hulk:#57d27a;--h-widow:#e8e6e1;--h-spidey:#ff6fb1;--h-panther:#a98bff;--h-wanda:#ff8f3d;--h-strange:#3fd0c9;--h-loki:#b5e35a}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font:14px/1.45 "Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
#g{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab}
#g.drag{cursor:grabbing}#g.pt{cursor:pointer}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* chrome */
.views{display:flex;gap:2px;margin-left:4px;padding-left:10px;border-left:1px solid var(--line)}.views a{padding:5px 9px;border-radius:7px;font-size:13px;font-weight:500;color:var(--sub);text-decoration:none;transition:color .2s,background .2s}.views a:hover{color:var(--ink)}.views a[aria-current=page]{color:var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}

.bar{position:fixed;z-index:5;top:16px;display:flex;align-items:center;gap:8px}
.bar.l{left:18px}.bar.r{right:18px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 4px}
.brand b{font-weight:600;font-size:14px}.brand span{color:var(--sub);font-size:13px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--sub);transition:background .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--ink)}
.btn{height:32px;padding:0 11px;border:1px solid var(--line);background:var(--panel);border-radius:9px;font-size:13px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px;transition:border-color .2s}
.btn:hover{border-color:var(--faint)}
.btn .n{font-family:"Geist Mono";font-size:11px;color:var(--accent)}
.btn.ic{width:32px;padding:0;justify-content:center}
select.btn{appearance:none;padding:0 10px}
.zoom{position:fixed;z-index:5;left:18px;bottom:18px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.zoom button{width:32px;height:32px;border:0;background:none;font-size:16px;color:var(--sub)}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{color:var(--ink)}

/* travel bar */
.travel{position:fixed;z-index:5;left:50%;bottom:18px;transform:translate(-50%,0);display:flex;align-items:center;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);transition:opacity .25s,transform .3s cubic-bezier(.2,.7,.2,1)}
.travel.off{opacity:0;transform:translate(-50%,12px);pointer-events:none}
.travel .now{min-width:260px;max-width:360px;padding:0 8px;overflow:hidden}
.travel .now small{display:block;color:var(--sub);font-size:11.5px}
.travel .now b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.travel .meter{height:2px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}.travel .meter i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* filters */
.pop{position:fixed;z-index:6;top:58px;right:18px;width:min(360px,calc(100vw - 36px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;
  opacity:0;transform:translateY(-4px);visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s .2s}
.pop.on{opacity:1;transform:none;visibility:visible;transition:opacity .2s,transform .2s}
.pop h3{margin:0 0 7px;font-size:12px;font-weight:500;color:var(--sub)}
.pop section{margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:none;border-radius:7px;padding:4px 9px;font-size:12.5px;color:var(--sub);display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint))}
.chip:hover{color:var(--ink)}
.chip[aria-pressed=true]{border-color:var(--c,var(--accent));color:var(--ink);background:var(--accent-soft)}
.yrs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.yrs select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 6px}
.pop .sum{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--sub)}
.link{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px}

/* card */
.card{position:fixed;z-index:4;right:18px;top:64px;width:min(320px,calc(100vw - 36px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 16px 14px;
  opacity:0;transform:translateX(8px);visibility:hidden;transition:opacity .22s,transform .3s cubic-bezier(.2,.7,.2,1),visibility 0s .22s}
.card.on{opacity:1;transform:none;visibility:visible;transition:opacity .22s,transform .3s cubic-bezier(.2,.7,.2,1)}
.card .x{position:absolute;top:10px;right:10px;width:26px;height:26px;border:0;background:none;color:var(--faint);border-radius:6px}
.card .x:hover{background:var(--accent-soft);color:var(--ink)}
.card .k{font-size:12px;color:var(--sub);display:flex;gap:8px;align-items:center}
.card .k i{width:8px;height:8px;border-radius:50%}
.card h2{margin:6px 28px 4px 0;font-size:19px;line-height:1.2;font-weight:600;letter-spacing:-.01em}
.card p{margin:0 0 12px;color:var(--sub);font-size:13.5px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0 0 12px;font-size:13px}
.card dt{color:var(--sub)}.card dd{margin:0}
.card .who{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.card .watch{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:11px;font-size:13px}
.card .watch b{font-weight:600}
.card .watch span{color:var(--sub)}
.tip{position:fixed;z-index:7;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:12.5px;box-shadow:var(--shadow);transform:translate(12px,12px);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.hint{position:fixed;z-index:3;left:50%;bottom:22px;transform:translateX(-50%);font-size:12.5px;color:var(--faint);transition:opacity .4s;pointer-events:none}
@media (max-width:720px){.bar.l .brand span{display:none}.bar.l .brand b{display:none}.bar.r{top:58px;left:18px;right:auto}.card{top:auto;bottom:84px;right:12px;left:12px;width:auto}.travel .now{min-width:0;width:44vw}.zoom{display:none}.hide-sm{display:none}.pop{top:100px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="g" aria-label="Graph of Marvel titles linked by shared heroes"></canvas>
<div class="bar l"><a class="brand" href="../" title="Home"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><g fill="none" stroke="var(--faint)" stroke-width="1.2"><path d="M4 14L9 6l7 4M9 6l1 9"/></g><circle cx="4" cy="14" r="2.2" fill="var(--node)"/><circle cx="9" cy="6" r="2.6" fill="var(--accent)"/><circle cx="16" cy="10" r="2" fill="var(--node)"/><circle cx="10" cy="15" r="1.6" fill="var(--node)"/></svg><b>MCU graph</b><span id="count"></span></a><nav class="views" aria-label="Views"><a href="../galaxy/" aria-current="page">Galaxy</a><a href="../chart/">Chart</a><a href="../city/">City</a></nav></div>
<div class="bar r">
  <div class="seg" id="mode" role="group" aria-label="Mode"><button data-m="explore" aria-pressed="true">Explore</button><button data-m="travel" aria-pressed="false">Travel</button></div>
  <button class="btn" id="fbtn" aria-expanded="false" aria-controls="pop">Filters <span class="n" id="fn"></span></button>
  <select class="btn" id="reg" aria-label="Your country"><option>IN</option><option>US</option><option>UK</option></select>
  <button class="btn ic" id="theme" aria-label="Switch light or dark"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
</div>
<div class="pop" id="pop" role="dialog" aria-label="Filters">
  <section><h3>Heroes</h3><div class="chips" id="fH"></div></section>
  <section><h3>Released</h3><div class="yrs"><select id="fFrom" aria-label="From year"></select>to<select id="fTo" aria-label="To year"></select></div></section>
  <section><h3>Type</h3><div class="chips" id="fT"></div></section>
  <section><h3>Order when travelling</h3><div class="chips" id="fO"><button class="chip" data-o="story" aria-pressed="true">Story</button><button class="chip" data-o="release" aria-pressed="false">Release</button></div></section>
  <section><div class="chips"><button class="chip" id="fE" aria-pressed="false">Essentials only</button></div></section>
  <div class="sum"><span id="fsum"></span><button class="link" id="fclear">Clear</button></div>
</div>
<div class="zoom" aria-label="Zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit everything" title="Fit everything"><svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button></div>
<div class="travel off" id="travel"><button class="btn ic" id="prev" aria-label="Previous">←</button><div class="now"><small id="tk"></small><b id="tt"></b><div class="meter"><i id="tm"></i></div></div><button class="btn ic" id="next" aria-label="Next">→</button><button class="btn" id="treset">Back to start</button></div>
<aside class="card" id="card" aria-live="polite"></aside>
<div class="tip" id="tip"></div>
<div class="hint" id="hint">Drag to move · scroll to zoom · click a title</div>
<script src="../assets/data.js"></script>
<script>
(() => {
const ALL = TITLES, REL = [...ALL].sort((a, b) => a.d.localeCompare(b.d));
const byId = new Map(ALL.map((x) => [x.id, x])), sIdx = new Map(ALL.map((x, i) => [x.id, i])), rIdx = new Map(REL.map((x, i) => [x.id, i]));
const heroesOf = (id) => HEROES.filter((h) => h.t.includes(id));
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const region = () => document.getElementById("reg").value;

/* ---------- graph: titles linked by shared heroes, plus the story thread ---------- */
const EDGES = [], seen = new Set(), add = (a, b, k) => { const key = a < b ? a + b : b + a; if (seen.has(key)) return; seen.add(key); EDGES.push({ a, b, k }); };
HEROES.forEach((h) => { const ts = ALL.filter((x) => h.t.includes(x.id)); for (let i = 1; i < ts.length; i++) add(ts[i - 1].id, ts[i].id, "hero"); });
for (let i = 1; i < ALL.length; i++) add(ALL[i - 1].id, ALL[i].id, "time");
const NB = new Map(ALL.map((x) => [x.id, new Set()])); EDGES.forEach((e) => { NB.get(e.a).add(e.b); NB.get(e.b).add(e.a); });
// a small force layout, run once at load: springs on links, repulsion between titles, and a gentle pull that keeps story time flowing left to right
const P = new Map(); let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
ALL.forEach((x, i) => P.set(x.id, { x: i * 17, y: (rnd() - 0.5) * 320, vx: 0, vy: 0 }));
(function settle() {
  const ids = ALL.map((x) => x.id);
  for (let it = 0; it < 420; it++) {
    const cool = 1 - it / 420;
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) { const a = P.get(ids[i]), b = P.get(ids[j]); let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy + 0.01; if (d2 > 90000) continue; const f = 2600 / d2, d = Math.sqrt(d2); dx /= d; dy /= d; a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f; }
    for (const e of EDGES) { const a = P.get(e.a), b = P.get(e.b), dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, L = e.k === "hero" ? 64 : 80, f = (d - L) * (e.k === "hero" ? 0.03 : 0.012); a.vx += (dx / d) * f; a.vy += (dy / d) * f; b.vx -= (dx / d) * f; b.vy -= (dy / d) * f; }
    ALL.forEach((x, i) => { const p = P.get(x.id); p.vx += (i * 17 - p.x) * 0.008; p.vy += -p.y * 0.0015; p.x += p.vx * 0.5 * cool; p.y += p.vy * 0.5 * cool; p.vx *= 0.6; p.vy *= 0.6; });
  }
})();

/* ---------- theme ---------- */
const root = document.documentElement;
const store = { get: () => { try { return localStorage.getItem("mcu-theme"); } catch { return null; } }, set: (v) => { try { localStorage.setItem("mcu-theme", v); } catch {} } };
if (store.get()) root.dataset.theme = store.get();
const isDark = () => (root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
let C = {};
const readTheme = () => { const cs = getComputedStyle(root), v = (n) => cs.getPropertyValue(n).trim(); C = { bg: v("--bg"), ink: v("--ink"), sub: v("--sub"), faint: v("--faint"), node: v("--node"), link: v("--link"), accent: v("--accent"), rel: v("--rel"), sto: v("--sto"), star: v("--star"), dark: isDark(), hero: Object.fromEntries(HEROES.map((h) => [h.id, v("--h-" + h.id)])) }; ask(); };
document.getElementById("theme").onclick = () => { root.dataset.theme = isDark() ? "light" : "dark"; store.set(root.dataset.theme); readTheme(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!root.dataset.theme) readTheme(); });

/* ---------- canvas + camera (it only ever moves because you moved it) ---------- */
const cv = document.getElementById("g"), cx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
const cam = { x: 0, y: 0, z: 1 }, tgt = { x: 0, y: 0, z: 1 };
const Z0 = 0.35, Z1 = 3.2, clampZ = (z) => Math.max(Z0, Math.min(Z1, z));
const toS = (p) => [W / 2 + (p.x - cam.x) * cam.z, H / 2 + (p.y - cam.y) * cam.z];
const toW = (sx, sy, c = cam) => [c.x + (sx - W / 2) / c.z, c.y + (sy - H / 2) / c.z];
function fit(ids = ALL.map((x) => x.id)) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  ids.forEach((id) => { const p = P.get(id); x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); });
  const pad = W < 720 ? 60 : 160; tgt.x = (x0 + x1) / 2; tgt.y = (y0 + y1) / 2; tgt.z = clampZ(Math.min((W - pad) / Math.max(1, x1 - x0), (H - pad - 60) / Math.max(1, y1 - y0)));
  ask();
}
const STARS = Array.from({ length: 220 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() < 0.1 ? 1.4 : 0.8, a: 0.2 + Math.random() * 0.5 }));
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0); ask(); }

/* ---------- state ---------- */
const F = { heroes: new Set(), types: new Set(), ess: false, from: 2008, to: 2026 };
const typeOf = (x) => (x.k === "film" ? "film" : x.k === "series" ? "series" : "other");
const match = (x) => (!F.heroes.size || heroesOf(x.id).some((h) => F.heroes.has(h.id))) && (!F.types.size || F.types.has(typeOf(x))) && (!F.ess || x.e === 1) && +x.d.slice(0, 4) >= F.from && +x.d.slice(0, 4) <= F.to;
let mode = "explore", order = "story", V = [], vSet = new Set(), ti = 0, sel = null, hover = null;
const A = new Map(ALL.map((x) => [x.id, { a: 0, r: 0 }])); // per-title animated alpha and radius, eased toward their targets
const born = performance.now();

/* ---------- drawing, on demand only ---------- */
let raf = 0;
function ask() { if (!raf) raf = requestAnimationFrame(frame); }
function frame(t) {
  raf = 0; let moving = false;
  const k = RM ? 1 : 0.2;
  for (const n of ["x", "y", "z"]) { const d = tgt[n] - cam[n]; if (Math.abs(d) > (n === "z" ? 0.0005 : 0.05)) { cam[n] += d * k; moving = true; } else cam[n] = tgt[n]; }
  const focus = hover || sel || (mode === "travel" && V[ti] ? V[ti].id : null), near = focus ? NB.get(focus) : null;
  // eased per-title state
  for (const x of ALL) { const s = A.get(x.id), inV = vSet.has(x.id), intro = RM ? 1 : Math.min(1, Math.max(0, (t - born - sIdx.get(x.id) * 14) / 500));
    const ta = (inV ? (focus ? (x.id === focus || near.has(x.id) ? 1 : 0.22) : 1) : 0.1) * intro, tr = (x.e === 1 ? 5 : x.e === 2 ? 3.8 : 3) * (x.id === focus ? 1.45 : 1) * intro;
    if (Math.abs(ta - s.a) > 0.01 || Math.abs(tr - s.r) > 0.02) { s.a += (ta - s.a) * (RM ? 1 : 0.22); s.r += (tr - s.r) * (RM ? 1 : 0.25); moving = true; } else { s.a = ta; s.r = tr; } }
  cx.fillStyle = C.bg; cx.fillRect(0, 0, W, H);
  // a quiet sky that drifts a little with the camera
  const T = Math.max(W, H);
  for (const s of STARS) { const px = (((s.x * T - cam.x * 0.08) % T) + T) % T, py = (((s.y * T - cam.y * 0.08) % T) + T) % T; if (px > W || py > H) continue; cx.fillStyle = `rgba(${C.star},${s.a * (C.dark ? 0.45 : 0.18)})`; cx.fillRect(px, py, s.s, s.s); }
  // links
  for (const e of EDGES) { const sa = A.get(e.a), sb = A.get(e.b), a = Math.min(sa.a, sb.a); if (a < 0.03) continue; const [x1, y1] = toS(P.get(e.a)), [x2, y2] = toS(P.get(e.b));
    const both = vSet.has(e.a) && vSet.has(e.b), hot = both && focus && (e.a === focus || e.b === focus), heroSel = F.heroes.size && e.k === "hero" && [...F.heroes].some((h) => { const H2 = HEROES.find((q) => q.id === h); return H2.t.includes(e.a) && H2.t.includes(e.b); });
    cx.strokeStyle = hot ? C.accent : heroSel ? C.hero[[...F.heroes].find((h) => { const H2 = HEROES.find((q) => q.id === h); return H2.t.includes(e.a) && H2.t.includes(e.b); })] : C.link;
    cx.globalAlpha = hot ? 0.9 : !both ? a * 0.3 : focus ? a * 0.6 : a * (e.k === "time" ? 0.55 : 1); cx.lineWidth = hot ? 1.4 : 1; if (e.k === "time" && !hot) cx.setLineDash([2, 4]);
    cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2, y2); cx.stroke(); cx.setLineDash([]); }
  cx.globalAlpha = 1;

  if (mode === "travel" && V.length > 1) { cx.strokeStyle = order === "story" ? C.sto : C.rel; cx.lineWidth = 1.3; cx.globalAlpha = 0.55; cx.lineJoin = "round"; cx.beginPath(); for (let i = 0; i <= ti; i++) { const [sx, sy] = toS(P.get(V[i].id)); i ? cx.lineTo(sx, sy) : cx.moveTo(sx, sy); } cx.stroke(); cx.globalAlpha = 1; }
  // nodes
  for (const x of ALL) { const s = A.get(x.id); if (s.a < 0.02) continue; const [sx, sy] = toS(P.get(x.id)); if (sx < -40 || sy < -40 || sx > W + 40 || sy > H + 40) continue;
    const isF = x.id === focus, r = s.r * Math.max(0.75, Math.min(1.6, Math.sqrt(cam.z)));
    cx.globalAlpha = s.a; cx.fillStyle = isF ? C.accent : C.node;
    if (isF) { cx.fillStyle = C.accent; cx.globalAlpha = 0.18; cx.beginPath(); cx.arc(sx, sy, r * 2.6, 0, 6.283); cx.fill(); cx.globalAlpha = 1; }
    cx.beginPath(); cx.arc(sx, sy, r, 0, 6.283); cx.fill(); }

  const boxes = [], order2 = [...ALL].sort((a, b) => (b.id === focus) - (a.id === focus) || (near ? near.has(b.id) - near.has(a.id) : 0) || a.e - b.e);
  cx.textBaseline = "middle";
  for (const x of order2) { const s = A.get(x.id); if (s.a < 0.15 || !vSet.has(x.id)) continue; const isF = x.id === focus, isN = near && near.has(x.id);
    const show = isF || isN || (!focus && (cam.z > 1.35 || (cam.z > 0.62 && x.e === 1))); if (!show) continue;
    const [sx, sy] = toS(P.get(x.id)); if (sx < -200 || sy < -20 || sx > W + 20 || sy > H + 20) continue;
    cx.font = `${isF ? 600 : x.e === 1 ? 500 : 400} ${isF ? 13.5 : 12}px Geist, system-ui`; const label = x.t.replace(" — ", ": "), w = cx.measureText(label).width, lx = sx + s.r * 1.4 + 6, b = [lx - 3, sy - 9, lx + w + 3, sy + 9];
    if (!isF && boxes.some((q) => !(b[2] < q[0] || b[0] > q[2] || b[3] < q[1] || b[1] > q[3]))) continue; boxes.push(b);
    cx.globalAlpha = isF ? 1 : Math.min(1, s.a + 0.1); cx.fillStyle = isF ? C.ink : x.e === 1 ? C.ink : C.sub; cx.fillText(label, lx, sy); }
  cx.globalAlpha = 1;
  if (moving || (!RM && t - born < 1400)) ask();
}

/* ---------- filters ---------- */
function rebuild() {
  const keep = V[ti] ? V[ti].id : null;
  V = (order === "story" ? ALL : REL).filter(match); vSet = new Set(V.map((x) => x.id));
  ti = Math.max(0, keep ? V.findIndex((x) => x.id === keep) : 0); if (ti < 0) ti = 0;
  const n = F.heroes.size + F.types.size + (F.ess ? 1 : 0) + (F.from !== 2008 || F.to !== 2026 ? 1 : 0);
  document.getElementById("fn").textContent = n || "";
  document.getElementById("count").textContent = `${V.length} of ${ALL.length} titles`;
  document.getElementById("fsum").textContent = `${V.length} titles · ${MW.hours(V.filter((x) => !x.soon).reduce((s, x) => s + x.m, 0))}`;
  document.querySelectorAll("#fH .chip").forEach((b) => b.setAttribute("aria-pressed", F.heroes.has(b.dataset.h)));
  document.querySelectorAll("#fT .chip").forEach((b) => b.setAttribute("aria-pressed", F.types.has(b.dataset.t)));
  document.querySelectorAll("#fO .chip").forEach((b) => b.setAttribute("aria-pressed", b.dataset.o === order));
  document.getElementById("fE").setAttribute("aria-pressed", F.ess); fFrom.value = F.from; fTo.value = F.to;
  if (sel && !vSet.has(sel)) closeCard();
  if (mode === "travel") goTo(ti, true); else if (V.length) fit(V.map((x) => x.id));
  ask();
}
const fH = document.getElementById("fH"), fT = document.getElementById("fT"), fFrom = document.getElementById("fFrom"), fTo = document.getElementById("fTo");
fH.innerHTML = HEROES.map((h) => `<button class="chip" style="--c:var(--h-${h.id})" data-h="${h.id}" aria-pressed="false"><i></i>${h.name}</button>`).join("");
fT.innerHTML = [["film", "Films"], ["series", "Series"], ["other", "Specials"]].map(([k, n]) => `<button class="chip" data-t="${k}" aria-pressed="false">${n}</button>`).join("");
const years = [...new Set(REL.map((x) => +x.d.slice(0, 4)))]; fFrom.innerHTML = fTo.innerHTML = years.map((y) => `<option>${y}</option>`).join("");
fH.onclick = (e) => { const b = e.target.closest(".chip"); if (!b) return; F.heroes.has(b.dataset.h) ? F.heroes.delete(b.dataset.h) : F.heroes.add(b.dataset.h); rebuild(); };
fT.onclick = (e) => { const b = e.target.closest(".chip"); if (!b) return; F.types.has(b.dataset.t) ? F.types.delete(b.dataset.t) : F.types.add(b.dataset.t); rebuild(); };
document.getElementById("fO").onclick = (e) => { const b = e.target.closest(".chip"); if (b) { order = b.dataset.o; rebuild(); } };
document.getElementById("fE").onclick = () => { F.ess = !F.ess; rebuild(); };
fFrom.onchange = () => { F.from = +fFrom.value; if (F.to < F.from) F.to = F.from; rebuild(); };
fTo.onchange = () => { F.to = +fTo.value; if (F.from > F.to) F.from = F.to; rebuild(); };
document.getElementById("fclear").onclick = () => { F.heroes.clear(); F.types.clear(); F.ess = false; F.from = 2008; F.to = 2026; rebuild(); };
const pop = document.getElementById("pop"), fbtn = document.getElementById("fbtn");
fbtn.onclick = () => { const on = !pop.classList.contains("on"); pop.classList.toggle("on", on); fbtn.setAttribute("aria-expanded", on); };
addEventListener("pointerdown", (e) => { if (pop.classList.contains("on") && !pop.contains(e.target) && !fbtn.contains(e.target)) { pop.classList.remove("on"); fbtn.setAttribute("aria-expanded", false); } });

/* ---------- card ---------- */
const card = document.getElementById("card");
function openCard(id) {
  sel = id; const x = byId.get(id), hs = heroesOf(id);
  card.innerHTML = `<button class="x" aria-label="Close">✕</button><div class="k"><i style="background:linear-gradient(135deg,${x.c[0]},${x.c[1]})"></i>${MW.kindLabel[x.k]} · ${MW.essLabel[x.e]}</div>
    <h2>${x.t.replace(" — ", ": ")}</h2><p>${x.hook}</p>
    <dl><dt>Released</dt><dd class="mono">${x.d.slice(0, 4)} · #${rIdx.get(id) + 1}</dd><dt>Happens</dt><dd class="mono">${x.y} · #${sIdx.get(id) + 1}</dd><dt>Runtime</dt><dd class="mono">${MW.hours(x.m)}${x.ep ? ` · ${x.ep} eps` : ""}</dd><dt>After credits</dt><dd>${x.pc ? `${x.pc} scene${x.pc > 1 ? "s" : ""}` : "None"}</dd></dl>
    ${hs.length ? `<div class="who">${hs.map((h) => `<button class="chip" style="--c:var(--h-${h.id})" data-h="${h.id}" aria-pressed="${F.heroes.has(h.id)}"><i></i>${h.name}</button>`).join("")}</div>` : ""}
    <div class="watch"><b>${x.soon ? "In cinemas" : MW.where(x, region())}</b><span>${x.soon ? "Dec 18, 2026" : "Streaming in " + region()}</span></div>`;
  card.classList.add("on"); ask();
}
function closeCard() { sel = null; card.classList.remove("on"); ask(); }
card.onclick = (e) => { if (e.target.closest(".x")) return closeCard(); const h = e.target.closest("[data-h]"); if (h) { F.heroes.has(h.dataset.h) ? F.heroes.delete(h.dataset.h) : F.heroes.add(h.dataset.h); rebuild(); openCard(sel); } };
document.getElementById("reg").onchange = () => sel && openCard(sel);

/* ---------- modes ---------- */
const travel = document.getElementById("travel"), hint = document.getElementById("hint");
function setMode(m) {
  mode = m; document.querySelectorAll("#mode button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.m === m));
  travel.classList.toggle("off", m !== "travel"); hint.style.opacity = m === "travel" ? 0 : 1;
  if (m === "travel") { tgt.z = clampZ(Math.max(cam.z, W < 720 ? 1.2 : 1.5)); goTo(ti, true); } else { closeCard(); fit(V.map((x) => x.id)); }
  ask();
}
document.getElementById("mode").onclick = (e) => { const b = e.target.closest("button"); if (b && b.dataset.m !== mode) setMode(b.dataset.m); };
function goTo(i, keepZoom) {
  if (!V.length) return; ti = Math.max(0, Math.min(V.length - 1, i)); const x = V[ti], p = P.get(x.id);
  tgt.x = p.x + (W > 720 ? 90 / tgt.z : 0); tgt.y = p.y; openCard(x.id);
  document.getElementById("tk").textContent = `${order === "story" ? "Story" : "Release"} order · ${ti + 1} of ${V.length}`;
  document.getElementById("tt").textContent = x.t.replace(" — ", ": ");
  document.getElementById("tm").style.width = ((ti + 1) / V.length) * 100 + "%"; ask();
}
document.getElementById("prev").onclick = () => goTo(ti - 1);
document.getElementById("next").onclick = () => goTo(ti + 1);
document.getElementById("treset").onclick = () => goTo(0);

/* ---------- input: drag, wheel, pinch, hover, click ---------- */
const ptrs = new Map(); let dragged = false, last = null, pinch0 = null;
const pick = (sx, sy) => { let best = null, bd = 16; for (const x of ALL) { if (!vSet.has(x.id)) continue; const [px, py] = toS(P.get(x.id)), d = Math.hypot(px - sx, py - sy); if (d < bd) { bd = d; best = x.id; } } return best; };
cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); dragged = false; last = [e.clientX, e.clientY]; if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: tgt.z }; } });
cv.addEventListener("pointermove", (e) => {
  if (ptrs.has(e.pointerId)) { ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 2 && pinch0) { const [a, b] = [...ptrs.values()]; tgt.z = cam.z = clampZ((pinch0.z * Math.hypot(a[0] - b[0], a[1] - b[1])) / pinch0.d); dragged = true; ask(); return; }
    const dx = e.clientX - last[0], dy = e.clientY - last[1]; if (Math.abs(dx) + Math.abs(dy) > 2) dragged = true;
    if (dragged) { cv.classList.add("drag"); tgt.x = cam.x -= dx / cam.z; tgt.y = cam.y -= dy / cam.z; last = [e.clientX, e.clientY]; ask(); } return; }
  const id = pick(e.clientX, e.clientY); if (id !== hover) { hover = id; cv.classList.toggle("pt", !!id); ask(); }
  const tip = document.getElementById("tip"); if (id && id !== sel) { const x = byId.get(id); tip.textContent = `${x.t.replace(" — ", ": ")} · ${x.d.slice(0, 4)}`; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.classList.add("on"); } else tip.classList.remove("on");
});
const up = (e) => { ptrs.delete(e.pointerId); cv.classList.remove("drag"); if (ptrs.size < 2) pinch0 = null;
  if (!dragged && e.type === "pointerup") { const id = pick(e.clientX, e.clientY); if (id) { if (mode === "travel") goTo(V.findIndex((x) => x.id === id)); else openCard(id); } else if (mode === "explore") closeCard(); } };
cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
cv.addEventListener("pointerleave", () => { if (hover) { hover = null; ask(); } document.getElementById("tip").classList.remove("on"); });
// wheel zooms toward the cursor in explore; in travel it steps through the order
let acc = 0, lastStep = 0;
cv.addEventListener("wheel", (e) => { e.preventDefault();
  if (mode === "travel" && !e.ctrlKey) { acc += e.deltaY; const now = performance.now(); if (Math.abs(acc) > 50 && now - lastStep > 280) { goTo(ti + Math.sign(acc)); acc = 0; lastStep = now; } return; }
  const [wx, wy] = toW(e.clientX, e.clientY, tgt), z = clampZ(tgt.z * Math.exp(-e.deltaY * 0.0016)); tgt.x = wx - (e.clientX - W / 2) / z; tgt.y = wy - (e.clientY - H / 2) / z; tgt.z = z; ask(); }, { passive: false });
const zoomBy = (f) => { tgt.z = clampZ(tgt.z * f); ask(); };
document.getElementById("zin").onclick = () => zoomBy(1.35); document.getElementById("zout").onclick = () => zoomBy(1 / 1.35); document.getElementById("zfit").onclick = () => fit(V.map((x) => x.id));
addEventListener("keydown", (e) => { if (e.target.closest("select")) return;
  if (e.key === "Escape") { pop.classList.remove("on"); closeCard(); }
  else if (mode === "travel" && (e.key === "ArrowRight" || e.key === "ArrowDown")) { e.preventDefault(); goTo(ti + 1); }
  else if (mode === "travel" && (e.key === "ArrowLeft" || e.key === "ArrowUp")) { e.preventDefault(); goTo(ti - 1); }
  else if (e.key === "Home") goTo(0); else if (e.key === "+" || e.key === "=") zoomBy(1.35); else if (e.key === "-") zoomBy(1 / 1.35); else if (e.key === "0") fit(V.map((x) => x.id)); });

/* ---------- start ---------- */
addEventListener("resize", resize); resize(); readTheme();
V = ALL.slice(); vSet = new Set(V.map((x) => x.id)); rebuild();
Object.assign(cam, tgt);
if (location.hash === "#travel") setMode("travel");
})();
